<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías</title>
    <link rel="stylesheet" href="build/css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<style>

</style>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="brand">
                <h1>Vansue</h1>
            </div>
            <ul class="menu">
                <li><a href="dashboard.html"><i class="fas fa-home"></i>Inicio</a></li>
                <li><a href="usuarios.html"><i class="fas fa-users"></i>Usuarios</a></li>
                <li><a href="ventas.html"><i class="fas fa-shopping-cart"></i>Ventas</a></li>
                <li><a href="inventario.html"><i class="fas fa-box"></i>Inventario</a></li>
                <li><a href="categorias.html" class="active"><i class="fas fa-list"></i>Categoría</a></li>
                <li><a href="compras.html"><i class="fas fa-receipt"></i>Compras</a></li>
                <li><a href="proveedores.html"><i class="fas fa-truck"></i>Proveedor</a></li>
                <li><a href="producto_proveedor.html"><i class="fas fa-truck"></i>Producto-Proveedor</a></li>
                <li><a href="clientes.html"><i class="fas fa-truck"></i>Clientes</a></li>
                <li><a href="#"><i class="fas fa-cogs"></i>Configuración</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header>
                <button class="hamburger" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h2>Gestion de Categorías</h2>
                <button class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    Cerrar Sesion</button>
            </header>

            <!-- Modal de Agregar Categorias -->
            <div id="addCategoryModal" class="modal">
                <div class="modal-content">
                    <span class="close-btn" onclick="closeModal()">&times;</span>
                    <form id="addCategoryForm" class="add-category-form">
                        <h4>Agregar Nueva Categoría</h4>
                        <div class="input-group">
                            <label for="categoryname">Nombre de Categoría</label>
                            <input type="text" id="categoryname" name="categoryname" required>
                        </div>
                        <div class="input-group">
                            <label for="parentCategory">Categoría Padre</label>
                            <select id="parentCategory">
                                <option value="">Sin categoría padre (Nivel principal)</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Tipo de Producto</label>
                        </div>
                        <div class="input-group">
                            <label for="categorydescription">Descripcion</label>
                            <input type="text" id="categorydescription" name="categorydescription" required>
                        </div>
                        <button type="submit" class="btn-add">Agregar Categoría</button>
                    </form>
                </div>
            </div>

            <!-- Modal de Editar Categorias -->
            <div id="editCategoryModal" class="modal">
                <div class="modal-content">
                    <span class="close-btn" onclick="closeEditModal()">&times;</span>
                    <form id="editCategoryForm" class="add-category-form">
                        <h4>Editar Categoría</h4>
                        <div class="input-group">
                            <label for="editCategoryName">Nombre de Categoría</label>
                            <input type="text" id="editCategoryName" name="categoryname" required>
                        </div>
                        <div class="input-group">
                            <label>Categoría Padre</label>
                            <select id="editParentCategory">
                                <option value="">Sin categoría padre</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="editCategoryDescription">Descripcion</label>
                            <input type="text" id="editCategoryDescription" name="categorydescription" required>
                        </div>
                        <button type="submit" class="btn-add">Guardar Categoría</button>
                    </form>
                </div>
            </div>

            <section class="actions">
                <button id="addCategoryBtn" class="add-btn"><i class="fas fa-user-plus"></i>Nueva Categoria</button>
            </section>

            <!-- Tabla de Categorias -->
            <section class="content">
                <table>
                    <thead>
                        <tr>
                            <td>ID</td>
                            <td>Nombre</td>
                            <td>Descripcion</td>
                            <td>Acciones</td>
                        </tr>
                    </thead>

                    <tbody id="CategoriesTable">
                        <!-- Las filas se generarán dinámicamente -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        const API = 'http://localhost:3000/categorias';

        // ========================
        // AUTH
        // ========================
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'index.html';

        // ========================
        // MODALES
        // ========================
        function openModal() {
            document.getElementById('addCategoryForm').reset();
            document.getElementById('parentCategory').selectedIndex = 0;
            loadParentCategories();
            document.getElementById('addCategoryModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('addCategoryModal').style.display = 'none';
            document.getElementById('addCategoryForm').reset();
            document.getElementById('parentCategory').selectedIndex = 0;
        }

        function closeEditModal() {
            document.getElementById('editCategoryModal').style.display = 'none';
        }

        document.getElementById('addCategoryBtn').addEventListener('click', openModal);

        // ========================
        // CARGAR CATEGORÍAS (CON JERARQUÍA)
        // ========================
        async function loadCategories() {
            try {
                const response = await fetch(API);
                const categories = await response.json();

                const table = document.getElementById('CategoriesTable');
                table.innerHTML = '';

                const tree = buildTree(categories);

                tree.forEach(category => {
                    const row = document.createElement('tr');

                    const indent = '&nbsp;'.repeat(category.level * 4);

                    row.innerHTML = `
                <td>${category.id}</td>
                <td>${indent} ${category.name}</td>
                <td>${category.description || ''}</td>
                <td>
                    <button class="edit-btn" onclick="openEditModal(${category.id})">✏️</button>
                    <button class="delete-btn" onclick="deleteCategory(${category.id})">🗑️</button>
                </td>
            `;

                    table.appendChild(row);
                });

            } catch (error) {
                console.error('Error cargando categorías', error);
            }
        }

        // ========================
        // CONSTRUIR ÁRBOL
        // ========================
        function buildTree(categories, parentId = null, level = 0) {
            return categories
                .filter(cat => cat.parent_id == parentId)
                .map(cat => [
                    { ...cat, level },
                    ...buildTree(categories, cat.id, level + 1)
                ])
                .flat();
        }

        // ========================
        // CARGAR SELECT PADRE
        // ========================
        async function loadParentCategories(selectedId = null) {
            try {
                const response = await fetch(API);
                const categories = await response.json();

                const selectAdd = document.getElementById('parentCategory');
                const selectEdit = document.getElementById('editParentCategory');

                if (selectAdd) {
                    selectAdd.innerHTML = `<option value="">Sin categoría padre</option>`;
                }

                if (selectEdit) {
                    selectEdit.innerHTML = `<option value="">Sin categoría padre</option>`;
                }

                categories.forEach(cat => {
                    const option1 = document.createElement('option');
                    option1.value = cat.id;
                    option1.textContent = cat.name;

                    const option2 = option1.cloneNode(true);

                    if (selectAdd) selectAdd.appendChild(option1);
                    if (selectEdit) selectEdit.appendChild(option2);
                });

                if (selectedId && selectEdit) {
                    selectEdit.value = selectedId;
                }

            } catch (error) {
                console.error('Error cargando categorías padre', error);
            }
        }

        // ========================
        // AGREGAR CATEGORÍA
        // ========================
        async function addCategory(event) {
            event.preventDefault();

            const categoryname = document.getElementById('categoryname').value;
            const categorydescription = document.getElementById('categorydescription').value;
            const parent_id = document.getElementById('parentCategory').value || null;

            try {
                const response = await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ categoryname, categorydescription, parent_id }),
                });

                if (!response.ok) throw new Error();

                alert('Categoría agregada');
                closeModal();
                loadCategories();
                document.getElementById('addCategoryForm').reset();

            } catch {
                alert('Error al agregar');
            }
        }

        // ========================
        // ABRIR MODAL EDITAR
        // ========================
        async function openEditModal(id) {
            try {
                const response = await fetch(`${API}/${id}`);
                const category = await response.json();

                document.getElementById('editCategoryName').value = category.name;
                document.getElementById('editCategoryDescription').value = category.description || '';
                document.getElementById('editProductType').value =
                    category.product_type;

                await loadParentCategories(category.parent_id);

                document.getElementById('editCategoryModal').style.display = 'block';

                document.getElementById('editCategoryForm').onsubmit =
                    (e) => updateCategory(e, id);

            } catch (error) {
                console.error(error);
                alert('Error al cargar categoría');
            }
        }

        // ========================
        // ACTUALIZAR
        // ========================
        async function updateCategory(event, id) {
            event.preventDefault();

            const name = document.getElementById('editCategoryName').value;
            const description = document.getElementById('editCategoryDescription').value;
            const parent_id = document.getElementById('editParentCategory').value || null;

            try {
                const response = await fetch(`${API}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description, parent_id }),
                });

                if (!response.ok) throw new Error();

                alert('Categoría actualizada');
                closeEditModal();
                loadCategories();

            } catch {
                alert('Error al actualizar');
            }
        }

        // ========================
        // ELIMINAR
        // ========================
        async function deleteCategory(id) {
            if (!confirm('¿Eliminar categoría?')) return;

            try {
                const response = await fetch(`${API}/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error();

                alert('Categoría eliminada');
                loadCategories();

            } catch {
                alert('Error al eliminar');
            }
        }

        // ========================
        // INIT
        // ========================
        document.getElementById('addCategoryForm').addEventListener('submit', addCategory);

        loadCategories();
    </script>
</body>

</html>
